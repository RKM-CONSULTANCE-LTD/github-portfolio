<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; background-color: #f6f8fa; color: #24292f; }
    .profile-header { background-color: #24292f; color: #ffffff; padding: 40px 20px; text-align: center; border-bottom: 1px solid #d0d7de; }
    .header-container { max-width: 800px; margin: 0 auto; }
    .avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #57606a; margin-bottom: 16px; }
    .profile-header h1 { margin: 0 0 8px 0; font-size: 28px; font-weight: 600; }
    .bio { font-size: 16px; color: #8c959f; margin: 0 0 16px 0; line-height: 1.5; }
    .meta-info { font-size: 13px; color: #8c959f; margin-bottom: 20px; }
    .btn-profile { display: inline-block; padding: 8px 16px; background-color: #2188ff; color: white; text-decoration: none; font-weight: 500; border-radius: 6px; font-size: 14px; }
    .portfolio-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid #d0d7de; padding-bottom: 12px; }
    .section-heading h2 { margin: 0; font-size: 20px; font-weight: 600; }
    #repo-search { padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 6px; width: 260px; font-size: 14px; outline: none; }
    .repos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .repo-card { background: #ffffff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-footer { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #57606a; margin-bottom: 12px; }
    .badge { background-color: #eaeef2; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .badge-check { background-color: #e6ffed; color: #22863a; border: 1px solid #22863a; }
    .repo-link { font-size: 13px; color: #0969da; text-decoration: none; font-weight: 500; }
    .loading-text, .error-text, .empty-text { grid-column: 1 / -1; text-align: center; padding: 40px; color: #57606a; font-style: italic; }
  </style>
</head>
<body>
  <header class="profile-header">
    <div class="header-container">
      <img id="avatar" src="https://placeholder.com" alt="Profile" class="avatar">
      <h1 id="name">Loading Profile...</h1>
      <p id="bio" class="bio">Syncing dataset logs...</p>
      <div class="meta-info">
        <span id="location">📍 Remote Location</span> • <span id="followers">👥 0 Followers</span>
      </div>
      <a id="github-link" href="#" target="_blank" class="btn-profile">🌐 View Complete Profile</a>
    </div>
  </header>

  <main class="portfolio-container">
    <div class="section-heading">
      <h2>📂 Verified Repositories</h2>
      <input type="text" id="repo-search" placeholder="Filter verified projects...">
    </div>
    <div id="repos-grid" class="repos-grid">
      <div class="loading-text">Analyzing root file definitions...</div>
    </div>
  </main>

  <script>
    // ⚠️ ENTER YOUR PERSONAL GITHUB USERNAME HERE
    const GITHUB_USERNAME = "rkmconsultancey-ai"; 

    // Securely prompt and store token in current browser tab session memory
    let GITHUB_TOKEN = sessionStorage.getItem("gh_token");
    if (!GITHUB_TOKEN) {
      GITHUB_TOKEN = prompt("Enter your GitHub Personal Access Token to bypass rate-limiting (optional):");
      if (GITHUB_TOKEN) sessionStorage.setItem("gh_token", GITHUB_TOKEN.trim());
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetchProfile();
      fetchRepos();
    });

    function getFetchOptions() {
      const headers = {};
      if (GITHUB_TOKEN) headers["Authorization"] = `token ${GITHUB_TOKEN}`;
      return { headers };
    }

    async function fetchProfile() {
      try {
        const res = await fetch(`https://github.com{GITHUB_USERNAME}`, getFetchOptions());
        const data = await res.json();
        document.getElementById("avatar").src = data.avatar_url;
        document.getElementById("name").textContent = data.name || data.login;
        document.getElementById("bio").textContent = data.bio || "No biography details available.";
        document.getElementById("location").textContent = `📍 ${data.location || 'Remote'}`;
        document.getElementById("followers").textContent = `👥 ${data.followers} Followers`;
        document.getElementById("github-link").href = data.html_url;
      } catch (e) { console.error(e); }
    }

    let allRepos = [];
    async function fetchRepos() {
      const grid = document.getElementById("repos-grid");
      try {
        const res = await fetch(`https://github.com{GITHUB_USERNAME}/repos?sort=updated&per_page=30`, getFetchOptions());
        const rawRepos = await res.json();
        allRepos = [];

        for (const repo of rawRepos) {
          if (repo.fork) continue; 
          const hasLicense = repo.license !== null;
          const hasReadme = repo.has_readme !== false;
          const hasGitIgnore = await verifyGitignoreFile(repo.name);

          if (hasLicense && hasReadme && hasGitIgnore) {
            allRepos.push(repo);
          }
        }
        renderRepos(allRepos);
      } catch (err) { grid.innerHTML = '<div class="error-text">Failed to filter active project indexes.</div>'; }
    }

    async function verifyGitignoreFile(name) {
      try {
        const check = await fetch(`https://github.com{GITHUB_USERNAME}/${name}/contents/.gitignore`, getFetchOptions());
        return check.status === 200;
      } catch (e) { return false; }
    }

    function renderRepos(repos) {
      const grid = document.getElementById("repos-grid");
      grid.innerHTML = repos.length ? "" : '<div class="empty-text">No repos found matching README, LICENSE, and .gitignore.</div>';
      repos.forEach(repo => {
        const card = document.createElement("div");
        card.className = "repo-card";
        card.innerHTML = `
          <h3>📦 ${repo.name}</h3>
          <p>${repo.description || 'No context details provided.'}</p>
          <div class="card-footer">
            <span class="badge">${repo.language || 'Data Stream'}</span>
            <span class="badge badge-check">⚖️ ${repo.license.spdx_id}</span>
            <span class="badge badge-check">📝 README</span>
            <span class="badge badge-check">🔒 .gitignore</span>
          </div>
          <a href="${repo.html_url}" target="_blank" class="repo-link">View Source Code →</a>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("repo-search").addEventListener("input", function(e) {
      const val = e.target.value.toLowerCase();
      renderRepos(allRepos.filter(r => r.name.toLowerCase().includes(val) || (r.language || "").toLowerCase().includes(val)));
    });
  </script>
</body>
</html>
